name: Desktop installers

on:
  pull_request:
    paths:
      - '.github/workflows/desktop-release.yml'
      - 'app/**'
      - 'config/**'
      - 'nativephp/**'
      - 'scripts/check-desktop-package.mjs'
      - 'public/icon.*'
      - 'composer.*'
      - 'README.md'
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    name: ${{ matrix.target }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux
            arch: x64
          - runner: windows-2025
            target: win
            arch: x64
          - runner: macos-15-intel
            target: mac
            arch: x64
          - runner: macos-15
            target: mac
            arch: arm64
    env:
      CI: 'true'
      NODE_ENV: 'development'
      NATIVEPHP_APP_VERSION: '0.4.0-alpha.1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # No signing credentials are available to untrusted pull requests.
      CSC_LINK: ${{ github.ref_type == 'tag' && matrix.target == 'mac' && secrets.MAC_CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ github.ref_type == 'tag' && matrix.target == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
      NATIVEPHP_APPLE_ID: ${{ github.ref_type == 'tag' && matrix.target == 'mac' && secrets.MAC_APPLE_ID || '' }}
      NATIVEPHP_APPLE_ID_PASS: ${{ github.ref_type == 'tag' && matrix.target == 'mac' && secrets.MAC_APPLE_ID_PASS || '' }}
      NATIVEPHP_APPLE_TEAM_ID: ${{ github.ref_type == 'tag' && matrix.target == 'mac' && secrets.MAC_APPLE_TEAM_ID || '' }}
      WIN_CSC_LINK: ${{ github.ref_type == 'tag' && matrix.target == 'win' && secrets.WIN_CSC_LINK || '' }}
      WIN_CSC_KEY_PASSWORD: ${{ github.ref_type == 'tag' && matrix.target == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: curl, dom, fileinfo, mbstring, openssl, pdo_sqlite, sqlite3, xml, zip
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nativephp/electron/package-lock.json
      - name: Verify tag and application version agree
        shell: bash
        run: |
          node -e 'const v=require("./nativephp/electron/package.json").version;const tag=process.env.GITHUB_REF_NAME; if(process.env.GITHUB_REF_TYPE==="tag" && tag!=="v"+v)process.exit(1);'
      - name: Install PHP dependencies
        shell: bash
        run: |
          composer validate --strict
          composer install --no-scripts --no-interaction --prefer-dist --no-progress
      - name: Install Electron build dependencies
        shell: bash
        working-directory: nativephp/electron
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run plugin:build
      - name: Create sanitized build environment and check privacy
        shell: bash
        run: |
          cp .env.example .env
          php artisan automatic-kimai:package-preflight
          php scripts/check-publication.php
      - name: Validate unique local application keys
        shell: bash
        working-directory: nativephp/electron
        run: node --test electron-plugin/tests/localAppKey.node.test.mjs
      - name: Prepare macOS app icon
        if: matrix.target == 'mac'
        shell: bash
        run: |
          mkdir -p public/icon.iconset
          for size in 16 32 128 256 512; do
            doubled=$((size * 2))
            sips -z "$size" "$size" public/icon.png --out "public/icon.iconset/icon_${size}x${size}.png" > /dev/null
            sips -z "$doubled" "$doubled" public/icon.png --out "public/icon.iconset/icon_${size}x${size}@2x.png" > /dev/null
          done
          iconutil -c icns public/icon.iconset -o public/icon.icns
          rm -rf public/icon.iconset
      - name: Compile platform-native installer
        shell: bash
        run: php artisan native:build ${{ matrix.target }} ${{ matrix.arch }} --no-interaction
      - name: Validate embedded PHP, Laravel and installer structure
        shell: bash
        run: node scripts/check-desktop-package.mjs ${{ matrix.target }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}-${{ matrix.arch }}
          path: release-output/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release-output
          merge-multiple: true
      - name: Verify all operating-system packages are present
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release-output -maxdepth 1 -name '*.AppImage' -type f | wc -l)" -eq 1
          test "$(find release-output -maxdepth 1 -name '*-setup.exe' -type f | wc -l)" -eq 1
          test "$(find release-output -maxdepth 1 -name '*-x64.dmg' -type f | wc -l)" -eq 1
          test "$(find release-output -maxdepth 1 -name '*-arm64.dmg' -type f | wc -l)" -eq 1
          (cd release-output && sha256sum -- * > SHA256SUMS.txt)
      - name: Publish downloads as an explicitly labelled preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          ### Automatic Kimai — pacotes de prévia multiplataforma

          Inclui o instalador Windows, Linux AppImage e pacotes macOS Intel e
          Apple Silicon. O runtime PHP e a interface Electron são integrados:
          não é necessário instalar PHP, Composer ou Node para abrir o aplicativo.

          **Distribuição de prévia, sem assinatura de código verificada.**
          Até que certificados Windows e Apple Developer ID/notarização sejam
          provisionados e os instaladores homologados em máquinas reais,
          esses arquivos não devem ser tratados como uma release estável de
          produção. Verifique os hashes SHA256 e as informações de instalação.
          A publicação automática de horas no Kimai permanece condicionada à
          autorização e à configuração de cada instalação.
          NOTES
          mapfile -d '' files < <(find release-output -maxdepth 1 -type f -print0)
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --target "$GITHUB_SHA" \
            --title "Automatic Kimai $GITHUB_REF_NAME (prévia)" \
            --prerelease --notes-file release-notes.md
