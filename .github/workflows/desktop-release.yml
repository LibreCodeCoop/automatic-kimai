name: Desktop installers

on:
  pull_request:
    paths:
      - '.github/workflows/desktop-release.yml'
      - 'app/**'
      - 'config/**'
      - 'nativephp/**'
      - 'scripts/check-desktop-package.mjs'
      - 'public/icon.*'
      - 'composer.*'
      - 'README.md'
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    name: ${{ matrix.target }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux
            arch: x64
          - runner: windows-2025
            target: win
            arch: x64
          - runner: macos-15-intel
            target: mac
            arch: x64
          - runner: macos-15
            target: mac
            arch: arm64
    env:
      CI: 'true'
      NODE_ENV: 'development'
      NATIVEPHP_APP_VERSION: '0.4.0'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # No signing credentials are available to untrusted pull requests.
      CSC_LINK: ${{ github.ref_type == 'tag' && matrix.target == 'mac' && secrets.MAC_CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ github.ref_type == 'tag' && matrix.target == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
      NATIVEPHP_APPLE_ID: ${{ github.ref_type == 'tag' && matrix.target == 'mac' && secrets.MAC_APPLE_ID || '' }}
      NATIVEPHP_APPLE_ID_PASS: ${{ github.ref_type == 'tag' && matrix.target == 'mac' && secrets.MAC_APPLE_ID_PASS || '' }}
      NATIVEPHP_APPLE_TEAM_ID: ${{ github.ref_type == 'tag' && matrix.target == 'mac' && secrets.MAC_APPLE_TEAM_ID || '' }}
      WIN_CSC_LINK: ${{ github.ref_type == 'tag' && matrix.target == 'win' && secrets.WIN_CSC_LINK || '' }}
      WIN_CSC_KEY_PASSWORD: ${{ github.ref_type == 'tag' && matrix.target == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: curl, dom, fileinfo, mbstring, openssl, pdo_sqlite, sqlite3, xml, zip
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nativephp/electron/package-lock.json
      - name: Verify tag and application version agree
        shell: bash
        run: |
          node -e 'const v=require("./nativephp/electron/package.json").version;const tag=process.env.GITHUB_REF_NAME; if(process.env.GITHUB_REF_TYPE==="tag" && tag!=="v"+v)process.exit(1);'
      - name: Install PHP dependencies
        shell: bash
        run: |
          composer validate --strict
          composer install --no-scripts --no-interaction --prefer-dist --no-progress
      - name: Install Electron build dependencies
        shell: bash
        working-directory: nativephp/electron
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run plugin:build
      - name: Check build dependency security and compatibility
        shell: bash
        working-directory: nativephp/electron
        run: node --test build/dependency-compat.test.mjs
      - name: Create sanitized build environment and check privacy
        shell: bash
        run: |
          cp .env.example .env
          php artisan automatic-kimai:package-preflight
          php scripts/check-publication.php
      - name: Validate unique local application keys
        shell: bash
        working-directory: nativephp/electron
        run: node --test electron-plugin/tests/localAppKey.node.test.mjs
      - name: Prepare macOS app icon
        if: matrix.target == 'mac'
        shell: bash
        run: |
          mkdir -p public/icon.iconset
          for size in 16 32 128 256 512; do
            doubled=$((size * 2))
            sips -z "$size" "$size" public/icon.png --out "public/icon.iconset/icon_${size}x${size}.png" > /dev/null
            sips -z "$doubled" "$doubled" public/icon.png --out "public/icon.iconset/icon_${size}x${size}@2x.png" > /dev/null
          done
          iconutil -c icns public/icon.iconset -o public/icon.icns
          rm -rf public/icon.iconset
      - name: Validate unsigned and signed release configuration
        shell: bash
        working-directory: nativephp/electron
        run: node --test build/release-signing.test.mjs
      - name: Compile platform-native installer
        shell: bash
        run: |
          # Do not present absent secrets as empty file paths to electron-builder.
          for variable in CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then unset "$variable"; fi
          done
          # Exercise release-style macOS signing resolution in pull requests,
          # not Electron Builder's automatic pull-request signing bypass.
          if [[ "${{ matrix.target }}" == mac && "${{ github.event_name }}" == pull_request ]]; then
            export CSC_FOR_PULL_REQUEST=true
          fi
          php artisan native:build ${{ matrix.target }} ${{ matrix.arch }} --no-interaction
      - name: Validate published release filenames
        shell: bash
        run: node --test scripts/check-desktop-package.test.mjs
      - name: Validate embedded PHP, Laravel and installer structure
        shell: bash
        run: node scripts/check-desktop-package.mjs ${{ matrix.target }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}-${{ matrix.arch }}
          path: release-output/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release-output
          merge-multiple: true
      - name: Verify all operating-system packages are present
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release-output -maxdepth 1 -name '*.AppImage' -type f | wc -l)" -eq 1
          test "$(find release-output -maxdepth 1 -name '*-setup.exe' -type f | wc -l)" -eq 1
          test "$(find release-output -maxdepth 1 -name '*-x64.dmg' -type f | wc -l)" -eq 1
          test "$(find release-output -maxdepth 1 -name '*-arm64.dmg' -type f | wc -l)" -eq 1
          # Stable asset names keep README download links on /releases/latest
          # valid across version changes; keep the version in the release tag.
          mv -- release-output/*.AppImage release-output/Automatic-Kimai-linux-x86_64.AppImage
          mv -- release-output/*-setup.exe release-output/Automatic-Kimai-windows-x64-setup.exe
          mv -- release-output/*-arm64.dmg release-output/Automatic-Kimai-macos-arm64.dmg
          mv -- release-output/*-x64.dmg release-output/Automatic-Kimai-macos-x64.dmg
          test "$(find release-output -maxdepth 1 -type f | wc -l)" -eq 4
          (cd release-output && sha256sum -- * > SHA256SUMS.txt)
      - name: Publish public desktop release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          ## Automatic Kimai — Windows, Linux e macOS

          Aplicação desktop para conciliar atividades e períodos trabalhados
          com o Kimai, com integrações opcionais ActivityWatch, Nextcloud,
          GitHub e Telegram. Inclui instaladores Linux AppImage, Windows
          e macOS Intel e Apple Silicon, com PHP integrado.

          ### Instalação e integridade
          Escolha o arquivo compatível com seu sistema operacional. Use
          `SHA256SUMS.txt` para verificar a integridade dos downloads.
          Não é necessário instalar PHP, Composer ou Node.js.

          ### Informação sobre assinatura
          **Os instaladores desta versão não estão assinados ou notarizados.**
          Windows SmartScreen e macOS Gatekeeper podem exibir avisos ou
          restringir a execução. Os hashes verificam integridade, mas não
          substituem a assinatura de procedência. Não foram concluídos
          testes de instalação em todas as máquinas físicas de destino.
          A atualização automática permanece desabilitada.

          ### Dados e envio de horas
          Integrações exigem autorização individual. Atividades observadas
          não equivalem automaticamente a horas trabalhadas; a publicação
          no Kimai depende da configuração e autorização em cada instalação.
          NOTES
          mapfile -d '' files < <(find release-output -maxdepth 1 -type f -print0)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --target "$GITHUB_SHA" \
              --title "Automatic Kimai $GITHUB_REF_NAME (prévia)" \
              --prerelease --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --target "$GITHUB_SHA" \
              --title "Automatic Kimai $GITHUB_REF_NAME" \
              --latest --notes-file release-notes.md
          fi
