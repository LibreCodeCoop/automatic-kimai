name: Desktop installers

on:
  pull_request:
    paths:
      - '.github/workflows/desktop-release.yml'
      - 'app/**'
      - 'config/**'
      - 'nativephp/**'
      - 'scripts/**'
      - '.github/RELEASE_NOTES.md'
      - 'public/icon.*'
      - 'composer.*'
      - 'README.md'
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to rebuild and publish; leave empty for preview.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.event_name == 'pull_request' && github.ref || 'release-serialization' }}
  cancel-in-progress: false

jobs:
  plan:
    name: Determine release from Conventional Commits
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Plan release or preview
        id: plan
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag || '' }}
        run: node scripts/plan-desktop-release.mjs --github-output

  packages:
    needs: plan
    if: >-
      needs.plan.outputs.publish == 'true' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    name: ${{ matrix.target }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux
            arch: x64
          - runner: windows-2025
            target: win
            arch: x64
          - runner: macos-15-intel
            target: mac
            arch: x64
          - runner: macos-15
            target: mac
            arch: arm64
    env:
      CI: 'true'
      NODE_ENV: 'development'
      NATIVEPHP_APP_VERSION: ${{ needs.plan.outputs.version }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # No signing credentials are available to untrusted pull requests.
      CSC_LINK: ${{ (needs.plan.outputs.publish == 'true' && github.event_name != 'pull_request') && matrix.target == 'mac' && secrets.MAC_CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ (needs.plan.outputs.publish == 'true' && github.event_name != 'pull_request') && matrix.target == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
      NATIVEPHP_APPLE_ID: ${{ (needs.plan.outputs.publish == 'true' && github.event_name != 'pull_request') && matrix.target == 'mac' && secrets.MAC_APPLE_ID || '' }}
      NATIVEPHP_APPLE_ID_PASS: ${{ (needs.plan.outputs.publish == 'true' && github.event_name != 'pull_request') && matrix.target == 'mac' && secrets.MAC_APPLE_ID_PASS || '' }}
      NATIVEPHP_APPLE_TEAM_ID: ${{ (needs.plan.outputs.publish == 'true' && github.event_name != 'pull_request') && matrix.target == 'mac' && secrets.MAC_APPLE_TEAM_ID || '' }}
      WIN_CSC_LINK: ${{ (needs.plan.outputs.publish == 'true' && github.event_name != 'pull_request') && matrix.target == 'win' && secrets.WIN_CSC_LINK || '' }}
      WIN_CSC_KEY_PASSWORD: ${{ (needs.plan.outputs.publish == 'true' && github.event_name != 'pull_request') && matrix.target == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: curl, dom, fileinfo, mbstring, openssl, pdo_sqlite, sodium, sqlite3, xml, zip
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nativephp/electron/package-lock.json
      - name: Stamp planned version into the packaging workspace
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            (cd nativephp/electron && npm version "$RELEASE_VERSION" --no-git-tag-version --ignore-scripts --allow-same-version)
          fi
          node scripts/desktop-version.mjs --github-env
      - name: Test versioning and release preparation without publishing
        shell: bash
        run: node --test scripts/desktop-version.test.mjs scripts/create-update-manifests.test.mjs scripts/prepare-desktop-release.test.mjs scripts/plan-desktop-release.test.mjs scripts/finalize-desktop-release.test.mjs
      - name: Install PHP dependencies
        shell: bash
        run: |
          composer validate --strict
          composer install --no-scripts --no-interaction --prefer-dist --no-progress
      - name: Install Electron build dependencies
        shell: bash
        working-directory: nativephp/electron
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run plugin:build
      - name: Check build dependency security and compatibility
        shell: bash
        working-directory: nativephp/electron
        run: node --test build/dependency-compat.test.mjs
      - name: Create sanitized build environment and check privacy
        shell: bash
        run: |
          cp .env.example .env
          php artisan automatic-kimai:package-preflight
          php scripts/check-publication.php
      - name: Validate unique local application keys
        shell: bash
        working-directory: nativephp/electron
        run: node --test electron-plugin/tests/localAppKey.node.test.mjs
      - name: Prepare macOS app icon
        if: matrix.target == 'mac'
        shell: bash
        run: |
          mkdir -p public/icon.iconset
          for size in 16 32 128 256 512; do
            doubled=$((size * 2))
            sips -z "$size" "$size" public/icon.png --out "public/icon.iconset/icon_${size}x${size}.png" > /dev/null
            sips -z "$doubled" "$doubled" public/icon.png --out "public/icon.iconset/icon_${size}x${size}@2x.png" > /dev/null
          done
          iconutil -c icns public/icon.iconset -o public/icon.icns
          rm -rf public/icon.iconset
      - name: Validate unsigned and signed release configuration
        shell: bash
        working-directory: nativephp/electron
        run: node --test build/release-signing.test.mjs
      - name: Compile platform-native installer
        shell: bash
        run: |
          # Do not present absent secrets as empty file paths to electron-builder.
          for variable in CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then unset "$variable"; fi
          done
          # Exercise release-style macOS signing resolution in pull requests,
          # not Electron Builder's automatic pull-request signing bypass.
          if [[ "${{ matrix.target }}" == mac && "${{ github.event_name }}" == pull_request ]]; then
            export CSC_FOR_PULL_REQUEST=true
          fi
          php artisan native:build ${{ matrix.target }} ${{ matrix.arch }} --no-interaction
      - name: Test update state machine and release metadata
        shell: bash
        run: node --test nativephp/electron/src/main/updates.test.mjs scripts/create-update-manifests.test.mjs
      - name: Validate published release filenames
        shell: bash
        run: node --test scripts/check-desktop-package.test.mjs
      - name: Validate embedded PHP, Laravel and installer structure
        shell: bash
        run: node scripts/check-desktop-package.mjs ${{ matrix.target }} ${{ matrix.arch }}
      - name: Check signed macOS update eligibility
        if: matrix.target == 'mac'
        shell: bash
        run: |
          # Only advertise a native macOS auto-update if Developer ID signing
          # and Gatekeeper notarization succeeded for this exact archive.
          if [[ -n "${CSC_LINK:-}" ]]; then
            app="$(find nativephp/electron/dist -maxdepth 3 -type d -name '*.app' -print -quit)"
            test -n "$app"
            codesign --verify --strict --deep "$app"
            codesign -dv --verbose=4 "$app" 2>&1 | grep -q 'Authority=Developer ID Application:'
            spctl --assess --type execute "$app"
            printf 'verified\n' > "release-output/verified-mac-${{ matrix.arch }}.marker"
          else
            # Without Developer ID, the app must still carry an ad hoc
            # signature; otherwise Apple Silicon Gatekeeper reports the
            # downloaded app as "damaged" instead of offering to open it.
            app="$(find nativephp/electron/dist -maxdepth 3 -type d -name '*.app' -print -quit)"
            test -n "$app"
            codesign --verify --strict --deep "$app"
            codesign -dv "$app" 2>&1 | grep -q 'Signature=adhoc'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}-${{ matrix.arch }}
          path: release-output/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: needs.plan.outputs.publish == 'true' && github.event_name != 'pull_request'
    needs: [plan, packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release-output
          merge-multiple: true
      - name: Stamp and validate release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            (cd nativephp/electron && npm version "$RELEASE_VERSION" --no-git-tag-version --ignore-scripts --allow-same-version)
          fi
          node scripts/desktop-version.mjs
      - name: Prepare and test release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: node scripts/prepare-desktop-release.mjs release-output "$RELEASE_TAG"
      - name: Prepare release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
        run: |
          set -euo pipefail
          cp .github/RELEASE_NOTES.md release-notes.md
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            node scripts/plan-desktop-release.mjs --notes "$BASE_SHA" "$GITHUB_SHA" "$RELEASE_TAG" > release-notes.md
          fi
      - name: Finalize versioned tag and publish verified assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            node scripts/finalize-desktop-release.mjs release-output "$RELEASE_TAG" --main-source "$GITHUB_SHA"
          else
            node scripts/finalize-desktop-release.mjs release-output "$RELEASE_TAG"
          fi
