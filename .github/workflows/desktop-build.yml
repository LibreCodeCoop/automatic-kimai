name: Build Automatic Kimai desktop previews

on:
  workflow_dispatch:
  push:
    tags:
      - "v0.3.*"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux
          - os: windows-2025
            label: windows
          - os: macos-15
            label: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application and packager
        run: python -m pip install ".[desktop,build,telegram]"
      - name: Run regression tests before packaging
        run: python -m unittest discover -s tests -v
      - name: Check GUI dependencies
        run: python -c "import tkinter; import cooperator_agent.runtime; import cooperator_agent.scheduler"
      - name: Build local-first executable
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name AutomaticKimai --collect-submodules cooperator_agent
          desktop_entry.py
      - name: Upload unsigned pilot artifact
        uses: actions/upload-artifact@v4
        with:
          name: automatic-kimai-${{ matrix.label }}-unsigned-pilot
          path: dist/**
          if-no-files-found: error
          retention-days: 14
