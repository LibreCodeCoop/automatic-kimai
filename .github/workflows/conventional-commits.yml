# SPDX-License-Identifier: GPL-3.0-or-later
# Same pinned Conventional Commits validator used by LibreSign.
name: Conventional commits
on:
  pull_request:
    types: [opened, edited, ready_for_review, reopened, synchronize]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate squash merge title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/plan-desktop-release.mjs --validate-title "$PR_TITLE"
      - uses: webiny/action-conventional-commits@7f91b1595ca1951cdb671ddc9f07a49081ec5b69 # v1.4.2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
