name: Public-source security checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Needed to fetch protected/private repository branch heads below.
          # The token is removed from local git config before scanning.
          persist-credentials: true
      - name: Check the complete accessible Git branch history with Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          folder="$RUNNER_TEMP/gitleaks-check"
          mkdir -m 700 -p "$folder"
          curl -fsSL --retry 3 --output "$folder/checksums.txt" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt"
          curl -fsSL --retry 3 --output "$folder/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          (
            cd "$folder"
            mv gitleaks.tar.gz "gitleaks_${version}_linux_x64.tar.gz"
            grep "gitleaks_${version}_linux_x64.tar.gz$" checksums.txt | sha256sum -c --status
            tar -xzf "gitleaks_${version}_linux_x64.tar.gz" gitleaks
            chmod 700 gitleaks
          )
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          # Avoid retaining a fetch credential in the worktree after use.
          git config --local --unset-all http.https://github.com/.extraheader || true
          if ! "$folder/gitleaks" git . --log-opts='--all' --redact \
              --report-format json --report-path "$folder/result.json" \
              >"$folder/scan.log" 2>&1; then
            echo '::error::Git history secret scan failed. Review privately; never upload the finding report.'
            exit 1
          fi
          echo 'Git history scan completed without findings.'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring
      - name: Refuse tracked private files and credential patterns
        run: php php-app/scripts/check-publication.php
      - name: Confirm the example environment is non-debugging
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'APP_DEBUG=false' php-app/.env.example
          grep -Fxq 'LOG_LEVEL=warning' php-app/.env.example
          grep -Fxq 'MAIL_MAILER=array' php-app/.env.example
          grep -Fxq 'SESSION_ENCRYPT=true' php-app/.env.example
          test ! -e .publication-denylist
          test ! -e php-app/secrets.enc
