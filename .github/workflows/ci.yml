name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -e ".[desktop]"
      - name: Unit tests (no live Kimai required)
        run: python -m unittest discover -s tests -v
      - name: Check for private or organization-specific source
        run: python tools/check_publication.py
      - name: Byte-compile package
        run: python -m compileall -q cooperator_agent kimai_client.py

  package:
    name: Build source and wheel
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Validate distributions and license
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile, zipfile
          dist = Path("dist")
          wheel = next(dist.glob("automatic_kimai-*.whl"))
          sdist = next(dist.glob("automatic_kimai-*.tar.gz"))
          with zipfile.ZipFile(wheel) as z:
              assert z.testzip() is None
              assert any(name.endswith(".dist-info/licenses/LICENSE") for name in z.namelist())
          with tarfile.open(sdist, "r:gz") as t:
              names = t.getnames()
              assert any(name.endswith("/LICENSE") for name in names)
              assert not any(".kimai_cache/" in name for name in names)
          print("Source and wheel metadata verified")
          PY
